services:
  api:
    build: .
    image: phishing-url-detector:latest
    container_name: phishing-url-detector
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
